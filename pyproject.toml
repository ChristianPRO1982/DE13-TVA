[project]
name = "de13-tva"
version = "0.1.0"
description = "Pipeline et API de validation de TVA intracommunautaire"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pandas>=3.0.5",
    "psycopg[binary]>=3.3.2",
    "uvicorn[standard]>=0.38.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
]

[tool.ruff]
line-length = 88
extend-exclude = ["*.ipynb"]

[tool.pytest.ini_options]
addopts = ""

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
fail_under = 100
